plugins {
    id "com.android.application"
}

def bridgeReleaseKeystore = System.getenv("OKVIDEOMAC_ANDROID_BRIDGE_KEYSTORE")
def bridgeReleaseStorePassword = System.getenv(
    "OKVIDEOMAC_ANDROID_BRIDGE_STORE_PASSWORD"
)
def bridgeReleaseKeyAlias = System.getenv("OKVIDEOMAC_ANDROID_BRIDGE_KEY_ALIAS")
def bridgeReleaseKeyPassword = System.getenv(
    "OKVIDEOMAC_ANDROID_BRIDGE_KEY_PASSWORD"
)

android {
    namespace = "com.okvideomac.dexbridge"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.okvideomac.dexbridge"
        minSdk = 24
        // Guard packages used by TVBox/FongMi discover the current Activity
        // through ActivityThread.mActivities. Android blocks that legacy
        // reflection for apps targeting API 28+, which leaves their account
        // dialogs with a null Context. Keep compiling with the current SDK,
        // but declare the compatibility level expected by those packages.
        targetSdk = 27
        versionCode = 56
        versionName = "0.3.44"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (bridgeReleaseKeystore != null) {
            bridgeRelease {
                storeFile = file(bridgeReleaseKeystore)
                storePassword = bridgeReleaseStorePassword
                keyAlias = bridgeReleaseKeyAlias
                keyPassword = bridgeReleaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // The packaging script supplies a pinned, persistent key whose
            // certificate is verified before and after this build. Never fall
            // back to Gradle's machine-local debug keystore for a deliverable.
            if (bridgeReleaseKeystore != null) {
                signingConfig = signingConfigs.bridgeRelease
            }
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += "/META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }

    // This helper is bundled inside the macOS app and installed only into its
    // private emulator. It is not distributed through Google Play, so the
    // store-only target-SDK lint rule does not apply.
    lint {
        disable += "ExpiredTargetSdkVersion"
    }
}

dependencies {
    implementation project(":catvod")
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
