name: OKVideoMac
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  OKVideoKit:
    path: Packages/OKVideoKit

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    SWIFT_VERSION: "5.7"
    CLANG_ENABLE_MODULES: true
    MARKETING_VERSION: 0.3.67
    CURRENT_PROJECT_VERSION: 93

targets:
  OKVideoMac:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: App
      - path: Features
      - path: Engines
      - path: Player
      - path: Resources
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../NOTICE.md
        buildPhase: resources
      - path: Docs/THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Docs/LEGAL_AND_SECURITY.md
        buildPhase: resources
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: OKVideoMac
        CFBundleName: OKVideoMac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSMultipleInstancesProhibited: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: "Copyright © 2026 Yao Lin"
        CFBundleDocumentTypes:
          - CFBundleTypeName: FongMi Configuration
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.okvideomac.configuration
            UTTypeDescription: FongMi Configuration
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - json
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.okvideomac.backup
            UTTypeDescription: OKVideoMac Portable Backup
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - okvideobackup
              public.mime-type:
                - application/vnd.okvideomac.backup+json
    postBuildScripts:
      - name: Embed Android Java/Dex bridge
        script: |
          BRIDGE_APK="${SRCROOT}/../../Helpers/AndroidDexBridge/app/build/outputs/apk/release/app-release.apk"
          if [[ -f "${BRIDGE_APK}" ]]; then
            RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
            mkdir -p "${RESOURCES_DIR}"
            cp "${BRIDGE_APK}" "${RESOURCES_DIR}/AndroidDexBridge-release.apk"
          fi
      - name: Embed optional libmpv runtime
        script: |
          BUILD_ROOT="${OKVIDEOMAC_BUILD_ROOT:-${SRCROOT}/Vendor/Build}"
          MPV_ROOT="${BUILD_ROOT}/libmpv"
          if [[ ! -d "${MPV_ROOT}" ]]; then
            MPV_ROOT="${SRCROOT}/Vendor/Build/libmpv"
          fi
          MPV_SOURCE="$(find "${MPV_ROOT}" -name 'libmpv*.dylib' -type f | head -n 1)"
          MPV_BRIDGE="${MPV_ROOT}/lib/libOKMPVBridge.dylib"
          if [[ -n "${MPV_SOURCE}" && -f "${MPV_BRIDGE}" ]]; then
            FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
            LICENSES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Licenses"
            mkdir -p "${FRAMEWORKS_DIR}"
            mkdir -p "${LICENSES_DIR}"
            cp "${MPV_SOURCE}" "${FRAMEWORKS_DIR}/libmpv.dylib"
            cp "${MPV_BRIDGE}" "${FRAMEWORKS_DIR}/libOKMPVBridge.dylib"
            cp "${MPV_ROOT}/licenses/"* "${LICENSES_DIR}/"
          fi
      - name: Embed optional QuickJS runtime
        script: |
          BUILD_ROOT="${OKVIDEOMAC_BUILD_ROOT:-${SRCROOT}/Vendor/Build}"
          QUICKJS_ROOT="${BUILD_ROOT}/QuickJS"
          if [[ ! -d "${QUICKJS_ROOT}" ]]; then
            QUICKJS_ROOT="${SRCROOT}/Vendor/Build/QuickJS"
          fi
          QUICKJS_SOURCE="${QUICKJS_ROOT}/lib/libOKQuickJS.dylib"
          if [[ -f "${QUICKJS_SOURCE}" ]]; then
            FRAMEWORKS_DIR="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
            LICENSES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Licenses"
            QUICKJS_DESTINATION="${FRAMEWORKS_DIR}/libOKQuickJS.dylib"
            mkdir -p "${FRAMEWORKS_DIR}"
            mkdir -p "${LICENSES_DIR}"
            rm -f "${QUICKJS_DESTINATION}"
            cp "${QUICKJS_SOURCE}" "${QUICKJS_DESTINATION}"
            cp "${QUICKJS_ROOT}/LICENSE" "${LICENSES_DIR}/QuickJS-MIT.txt"
          fi
      - name: Embed optional Node runtime
        script: |
          NODE_SOURCE="${OKVIDEOMAC_NODE_RUNTIME:-}"
          if [[ -z "${NODE_SOURCE}" ]]; then
            NODE_SOURCE="$(command -v node || true)"
          fi
          if [[ ! -x "${NODE_SOURCE}" ]]; then
            if [[ "${CONFIGURATION}" == "Release" ]]; then
              echo "Node runtime not found. Set OKVIDEOMAC_NODE_RUNTIME to the supported Node executable." >&2
              exit 1
            fi
            exit 0
          fi
          while [[ -L "${NODE_SOURCE}" ]]; do
            NODE_LINK="$(readlink "${NODE_SOURCE}")"
            if [[ "${NODE_LINK}" == /* ]]; then
              NODE_SOURCE="${NODE_LINK}"
            else
              NODE_SOURCE="$(cd "$(dirname "${NODE_SOURCE}")" && pwd)/${NODE_LINK}"
            fi
          done
          NODE_SOURCE="$(cd "$(dirname "${NODE_SOURCE}")" && pwd)/$(basename "${NODE_SOURCE}")"
          NODE_ROOT="$(cd "$(dirname "${NODE_SOURCE}")/.." && pwd)"
          NODE_VERSION="$("${NODE_SOURCE}" --version 2>/dev/null || true)"
          if [[ "${NODE_VERSION}" != v22.* ]]; then
            if [[ "${CONFIGURATION}" == "Release" ]]; then
              echo "Unsupported Node runtime ${NODE_VERSION:-unknown}. Provide Node 22 with OKVIDEOMAC_NODE_RUNTIME." >&2
              exit 1
            fi
            exit 0
          fi
          if [[ ! -f "${NODE_ROOT}/LICENSE" ]]; then
            if [[ "${CONFIGURATION}" == "Release" ]]; then
              echo "Node license not found at ${NODE_ROOT}/LICENSE. Provide a complete Node 22 distribution with OKVIDEOMAC_NODE_RUNTIME." >&2
              exit 1
            fi
            exit 0
          fi
          RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          NODE_DIR="${RESOURCES_DIR}/NodeRuntime"
          LICENSES_DIR="${RESOURCES_DIR}/Licenses"
          mkdir -p "${NODE_DIR}" "${LICENSES_DIR}"
          cp "${NODE_SOURCE}" "${NODE_DIR}/node"
          chmod 755 "${NODE_DIR}/node"
          cp "${NODE_ROOT}/LICENSE" "${LICENSES_DIR}/Node.js-LICENSE.txt"
    dependencies:
      - package: OKVideoKit
        product: OKVideoCore
      - package: OKVideoKit
        product: OKVideoPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okvideomac.OKVideoMac
        PRODUCT_NAME: OKVideoMac
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Supporting/OKVideoMac.dev.entitlements
          ENABLE_HARDENED_RUNTIME: false
        Release:
          CODE_SIGN_ENTITLEMENTS: Supporting/OKVideoMac.release.entitlements
          ENABLE_HARDENED_RUNTIME: true

  OKVideoMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: Tests
    dependencies:
      - target: OKVideoMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.okvideomac.OKVideoMacTests
        GENERATE_INFOPLIST_FILE: true

schemes:
  OKVideoMac:
    build:
      targets:
        OKVideoMac: all
        OKVideoMacTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - OKVideoMacTests
    run:
      config: Debug
    archive:
      config: Release
