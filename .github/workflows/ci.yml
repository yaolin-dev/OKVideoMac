name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  ci:
    name: CI required
    if: always()
    needs: [core, node, offline, android, app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Require every job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 Tools/CI/check_jobs.py

  app:
    name: Main App Release compile (unsigned)
    needs: android
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
      - name: Prepare SHA-256 verified XcodeGen
        run: |
          mkdir -p '${{ runner.temp }}/okvideo-reports/app'
          python3 Tools/CI/fetch_tool.py xcodegen --output '${{ runner.temp }}/okvideo-ci-tools' > '${{ runner.temp }}/okvideo-reports/app/tool-download.log' 2>&1
      - name: Receive tested compile-only bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-compile-input
          path: ${{ runner.temp }}/okvideo-android-compile-input
      - name: Restore pinned App dependency inputs
        id: app-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/okvideo-app-dependencies/CrashReporter/Source
            ${{ runner.temp }}/okvideo-app-dependencies/Downloads
            ${{ runner.temp }}/okvideo-app-dependencies/SourcePackages
          key: app-deps-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.2-${{ hashFiles('OKVideoMac/macOS/OKVideoMac/Packages/OKCrashDiagnostics/Package.swift', 'OKVideoMac/macOS/OKVideoMac/Scripts/prepare-crash-reporter.sh', 'OKVideoMac/macOS/OKVideoMac/Scripts/prepare-sparkle.py', 'ThirdParty/sparkle-lock.json') }}
      - name: Compile and verify Release App structure without signing
        run: >-
          python3 Tools/CI/run_app.py
          --work-dir '${{ runner.temp }}/okvideo-app-compile'
          --dependencies '${{ runner.temp }}/okvideo-app-dependencies'
          --output '${{ runner.temp }}/okvideo-reports/app'
          --bridge-input '${{ runner.temp }}/okvideo-android-compile-input'
          --xcodegen '${{ runner.temp }}/okvideo-ci-tools/xcodegen'
      - name: Retain App compilation evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-compile-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okvideo-reports/app/
          if-no-files-found: error
          retention-days: 7
      - name: Save successful main App dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/okvideo-app-dependencies/CrashReporter/Source
            ${{ runner.temp }}/okvideo-app-dependencies/Downloads
            ${{ runner.temp }}/okvideo-app-dependencies/SourcePackages
          key: ${{ steps.app-cache.outputs.cache-primary-key }}

  android:
    name: Android Release JVM and unsigned bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/../okvideo-gradle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17.0.19+10'
      - name: Restore locked Gradle dependencies
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-java17.0.19-${{ hashFiles('OKVideoMac/Helpers/AndroidDexBridge/**/*.gradle', 'OKVideoMac/Helpers/AndroidDexBridge/**/*.lockfile', 'OKVideoMac/Helpers/AndroidDexBridge/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build unsigned bridge and run Release JVM tests
        run: >-
          python3 Tools/CI/run_android.py
          --work-dir '${{ runner.temp }}/okvideo-android'
          --output '${{ runner.temp }}/okvideo-reports/android'
          --artifact-dir '${{ runner.temp }}/okvideo-android-compile-input'
      - name: Retain Android evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okvideo-reports/android/
          if-no-files-found: error
          retention-days: 7
      - name: Transfer compile-only unsigned APK to the App job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-compile-input
          path: ${{ runner.temp }}/okvideo-android-compile-input/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Save successful main Gradle cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  offline:
    name: Offline audits and static checks
    runs-on: macos-14
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
      - name: Prepare SHA-256 verified actionlint
        run: |
          mkdir -p '${{ runner.temp }}/okvideo-reports/offline'
          python3 Tools/CI/fetch_tool.py actionlint --output '${{ runner.temp }}/okvideo-ci-tools' > '${{ runner.temp }}/okvideo-reports/offline/tool-download.log' 2>&1
      - name: Run all offline audits and static checks
        run: >-
          python3 Tools/CI/run_offline.py
          --output '${{ runner.temp }}/okvideo-reports/offline'
          --work-dir '${{ runner.temp }}/okvideo-offline-fixtures'
          --actionlint '${{ runner.temp }}/okvideo-ci-tools/actionlint'
      - name: Retain offline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okvideo-reports/offline/
          if-no-files-found: error
          retention-days: 7

  node:
    name: Node
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.0'
      - name: Verify report failure paths
        run: python3 Tools/CI/run_python.py --suite ci --output '${{ runner.temp }}/okvideo-reports/node/validator'
      - name: Run every Node test file
        run: python3 Tools/CI/run_node.py --output '${{ runner.temp }}/okvideo-reports/node'
      - name: Retain Node evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okvideo-reports/node/
          if-no-files-found: error
          retention-days: 7

  core:
    name: Core (${{ matrix.configuration }})
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Verify selected toolchain and result-validator failure paths
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          python3 Tools/CI/run_python.py --suite ci --output '${{ runner.temp }}/okvideo-reports/core-${{ matrix.configuration }}/validator'
      - name: Restore configuration-specific build cache
        id: core-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/okvideo-core-${{ matrix.configuration }}
          key: core-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.2-${{ matrix.configuration }}-${{ hashFiles('OKVideoMac/macOS/OKVideoMac/Packages/OKVideoKit/**') }}
      - name: Build, discover and run complete suite
        run: >-
          python3 Tools/CI/run_core.py
          --configuration '${{ matrix.configuration }}'
          --scratch-path '${{ runner.temp }}/okvideo-core-${{ matrix.configuration }}'
          --output '${{ runner.temp }}/okvideo-reports/core-${{ matrix.configuration }}'
          --jobs 2
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/okvideo-reports/core-${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 7
      - name: Save successful main build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/okvideo-core-${{ matrix.configuration }}
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
